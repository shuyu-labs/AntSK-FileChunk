version: '3.8'

services:
  antsk-filechunk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antsk-filechunk
    ports:
      - "8001:8000"
    volumes:
      # 挂载临时文件目录，用于文件上传处理
      - ./temp:/app/temp
      # 挂载配置目录（可选）
      - ./config:/app/config
      # 挂载静态文件目录（可选）
      - ./static:/app/static
    environment:
      # Python 环境变量
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # 应用配置
      - LOG_LEVEL=info
      - HOST=0.0.0.0
      - PORT=8000
      - IMAGE_BASE_URL=https://filechunk.antsk.cn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - antsk-network

  # # 可选：添加 Nginx 反向代理
  # nginx:
  #   image: nginx:alpine
  #   container_name: antsk-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     # SSL 证书目录（如果需要 HTTPS）
  #     # - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - antsk-filechunk
  #   restart: unless-stopped
  #   networks:
  #     - antsk-network
  #   profiles:
  #     - with-nginx

networks:
  antsk-network:
    driver: bridge
