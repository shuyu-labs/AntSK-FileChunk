version: '3.8'

services:
  antsk-filechunk:
    build:
      context: .
      dockerfile: Dockerfile
    image: antsk/filechunk:latest
    container_name: antsk-filechunk-app
    ports:
      - "8000:8000"
    volumes:
      # 挂载临时文件目录（用于文件上传处理）
      - ./temp:/app/temp
      # 挂载日志目录
      - ./logs:/app/logs
      # 挂载配置目录（可选）
      - ./config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # 可以在这里设置其他环境变量
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - antsk-network

  # 可选：添加 Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: antsk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - antsk-filechunk
    restart: unless-stopped
    networks:
      - antsk-network
    profiles:
      - production

networks:
  antsk-network:
    driver: bridge
