# AntSK FileChunk 服务配置

# 上游服务器定义
upstream antsk_backend {
    server antsk-filechunk:8000;
    # 如果有多个实例，可以添加更多服务器
    # server antsk-filechunk-2:8000;
    # server antsk-filechunk-3:8000;
    
    # 负载均衡方法
    # least_conn;  # 最少连接
    # ip_hash;     # IP 哈希
}

# HTTP 服务器配置
server {
    listen 80;
    server_name localhost;

    # 访问日志
    access_log /var/log/nginx/antsk_access.log main;
    error_log /var/log/nginx/antsk_error.log;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 主应用代理
    location / {
        proxy_pass http://antsk_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API 路由特殊配置
    location /api/ {
        proxy_pass http://antsk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 文件上传超时设置
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 健康检查
    location /health {
        proxy_pass http://antsk_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态文件缓存
    location /static/ {
        proxy_pass http://antsk_backend;
        proxy_set_header Host $host;
        
        # 缓存设置
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 机器人文件
    location = /robots.txt {
        proxy_pass http://antsk_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://antsk_backend;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
    }
}

# HTTPS 服务器配置（可选）
server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL 证书配置（需要提供证书文件）
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 其他配置与 HTTP 相同
    access_log /var/log/nginx/antsk_ssl_access.log main;
    error_log /var/log/nginx/antsk_ssl_error.log;

    location / {
        proxy_pass http://antsk_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
