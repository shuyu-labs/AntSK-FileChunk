# AntSK 语义文本切片服务默认配置

[chunking]
# 切片大小配置
min_chunk_size = 200
max_chunk_size = 1500
target_chunk_size = 800

# 语义配置
semantic_threshold = 0.7
paragraph_merge_threshold = 0.8
overlap_ratio = 0.1

# 语言配置
language = "zh"

# 模型配置
embedding_model = "all-MiniLM-L6-v2"

# 处理配置
preserve_structure = true
handle_special_content = true

[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[performance]
batch_size = 32
max_workers = 4
cache_embeddings = true
