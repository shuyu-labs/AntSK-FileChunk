version: '3.8'

services:
  antsk-filechunk-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: antsk/filechunk:dev
    container_name: antsk-filechunk-dev
    ports:
      - "8000:8000"
    volumes:
      # 开发时挂载源码，支持热重载
      - .:/app
      - /app/__pycache__
      - /app/src/antsk_filechunk/__pycache__
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DEVELOPMENT=true
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=debug
    command: ["python", "api_server.py"]
    restart: unless-stopped
    networks:
      - antsk-dev-network

networks:
  antsk-dev-network:
    driver: bridge
